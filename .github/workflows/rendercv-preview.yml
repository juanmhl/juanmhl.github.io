name: RenderCV preview

on:
  push:
    branches:
      - rendercv-preview
    paths:
      - 'cv/Juan_Maria_Herrera_Lopez_CV.yaml'
      - '.github/workflows/rendercv-preview.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install RenderCV
        run: python -m pip install 'rendercv[full]==2.8'

      - name: Render theme previews
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p theme-previews
          for theme in engineeringresumes engineeringclassic harvard ink; do
            echo "Rendering $theme"
            rendercv render cv/Juan_Maria_Herrera_Lopez_CV.yaml --design.theme "$theme"
            mkdir -p "theme-previews/$theme"
            cp -R cv/rendercv_output/. "theme-previews/$theme/"
            rm -rf cv/rendercv_output
          done

      - name: Show generated files
        run: find theme-previews -type f -maxdepth 4 -print

      - name: Upload RenderCV outputs
        uses: actions/upload-artifact@v4
        with:
          name: rendercv-theme-previews
          path: theme-previews/**
          if-no-files-found: error
