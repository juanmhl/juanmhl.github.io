name: Publish selected RenderCV CV

on:
  push:
    branches:
      - rendercv-preview
    paths:
      - '.github/workflows/rendercv-preview.yml'

permissions:
  contents: write

jobs:
  render-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: rendercv-preview

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install RenderCV
        run: python -m pip install 'rendercv[full]==2.8'

      - name: Render Engineering Classic CV
        run: |
          rm -rf cv/rendercv_output
          rendercv render cv/Juan_Maria_Herrera_Lopez_CV.yaml --design.theme engineeringclassic
          PDF=$(find cv/rendercv_output -type f -name '*.pdf' | head -n 1)
          test -n "$PDF"
          cp "$PDF" /tmp/cv.pdf

      - name: Checkout website main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: website-main

      - name: Publish CV on website
        run: |
          cp /tmp/cv.pdf website-main/public/cv.pdf
          cd website-main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/cv.pdf
          if git diff --cached --quiet; then
            echo 'CV already up to date.'
          else
            git commit -m 'Publish updated Engineering Classic CV'
            git push origin main
          fi
