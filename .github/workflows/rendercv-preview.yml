name: RenderCV preview

on:
  push:
    branches:
      - rendercv-preview
    paths:
      - 'cv/Juan_Maria_Herrera_Lopez_CV.yaml'
      - '.github/workflows/rendercv-preview.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install RenderCV
        run: python -m pip install 'rendercv[full]==2.8'

      - name: Render CV
        run: rendercv render cv/Juan_Maria_Herrera_Lopez_CV.yaml

      - name: Show generated files
        run: find . -path '*rendercv_output*' -type f -maxdepth 5 -print

      - name: Upload RenderCV output
        uses: actions/upload-artifact@v4
        with:
          name: rendercv-preview
          path: |
            rendercv_output/**
            cv/rendercv_output/**
          if-no-files-found: error
